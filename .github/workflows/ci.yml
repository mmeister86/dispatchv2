name: App checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, devbox]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      # Tests write fixed /tmp paths; persistent runner must start clean (shortcut: fails if another local user left such files, fix tests to use mkdtemp then)
      - run: rm -rf /tmp/dispatch-* /tmp/dispatch*.json /tmp/task*.png /tmp/task42-evidence
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run --maxWorkers=4 --testTimeout=15000
      - run: pnpm test:evals
      - run: pnpm build
      - run: pnpm test:bundle
      - run: pnpm exec playwright install chromium && pnpm test:e2e
      - run: pnpm test:browser
